name = "ABAP BDEF"
grammar = "abap_bdef"
# behavior definitions (`zray sap pull` and abapGit names)
path_suffixes = ["bdef", "asbdef"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 2
hard_tabs = false
word_characters = ["_", "$"]
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
